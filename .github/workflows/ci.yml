  build:
    runs-on: [ self-hosted, local, k8s ]
#    needs: [ owasp-report ]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Build Docker image
        run: docker build -t api-garage:${{ github.sha }} -t api-garage:latest .

      - name: Push to Local Registry
        run: |
          # 1. Configura o registro como inseguro para o daemon do Docker atual
          # Se o diretório /etc/docker não existir, nós o criamos.
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries": ["kind-registry:5000"]}' | sudo tee /etc/docker/daemon.json
          
          # Como o dind já está rodando, precisamos recarregar as configurações.
          # Em alguns ambientes dind, enviar um SIGHUP ou reiniciar o serviço funciona:
          sudo kill -HUP $(pidof dockerd) || true
          sleep 2 # Dá um pequeno respiro para o daemon processar o reload
          
          REGISTRY="kind-registry:5000"
          
          # 2. Builda a imagem apontando para o registro
          docker build -t $REGISTRY/api-garage:${{ github.sha }} .
          
          # 3. Empurra para o registro (agora aceitando HTTP)
          docker push $REGISTRY/api-garage:${{ github.sha }}