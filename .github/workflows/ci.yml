  build:
    runs-on: [ self-hosted, local, k8s ]
#    needs: [ owasp-report ]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Build Docker image
        run: docker build -t api-garage:${{ github.sha }} -t api-garage:latest .

      - name: Load image into cluster containerd
        run: |
          # 1. Exporta a imagem gerada no passo anterior pelo dind para um arquivo tar
          docker save -o api-garage.tar api-garage:${{ github.sha }}
          
          # 2. Usa um container temporário que possui o binário 'ctr' e monta o socket do containerd do nó 
          # (Como o runner roda na mesma máquina do Kind, o socket mapeado aponta para o containerd do nó)
          docker run --rm \
            -v /run/containerd/containerd.sock:/run/containerd/containerd.sock \
            -v $(pwd)/api-garage.tar:/tmp/api-garage.tar \
            linuxkit/containerd:v0.7 \
            ctr -a /run/containerd/containerd.sock -n k8s.io images import /tmp/api-garage.tar
          
          # 3. Limpa o arquivo tar temporário
          rm -f api-garage.tar