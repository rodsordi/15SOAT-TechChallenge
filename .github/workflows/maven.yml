name: Java CI with Maven

on:
  push:
    branches: [ "fase2" ]
  pull_request:
    branches: [ "fase2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: JDK 25 config
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml