name: Java CI with Maven

on:
  push:
    branches: [ "phase2" ]
  pull_request:
    branches: [ "phase2" ]

jobs:
  code-quality:
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: JDK 25 config
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Test and SonarQube analysis
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.host.url=http://sonarqube:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

  build:
    needs: code-quality
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: JDK 25 config
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Cache application artifact locally
        run: |
          mkdir -p /tmp/actions-cache/${{ github.run_id }}
          cp application/target/*.jar /tmp/actions-cache/${{ github.run_id }}/

  docker-image:
    needs: build
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Restore application artifact from local cache
        run: |
          mkdir -p application/target
          cp /tmp/actions-cache/${{ github.run_id }}/*.jar application/target/

      - name: Build Docker image
        run: docker build -t api-garage:${{ github.sha }} -t api-garage:latest .

      - name: Clean up local cache
        if: always()
        run: rm -rf /tmp/actions-cache/${{ github.run_id }}

  deploy:
    needs: docker-image
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Load image into cluster containerd
        run: docker save api-garage:${{ github.sha }} | ctr -a /run/containerd/containerd.sock -n k8s.io images import -

      - name: Deploy with Helm
        run: |
          helm upgrade --install api-garage iac/charts/app \
            --namespace default \
            --set image.repository=api-garage \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Never \
            --set service.port=8080 \
            --set env.SPRING_PROFILES_ACTIVE=local \
            --set env.SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres \
            --set env.SPRING_DATASOURCE_USERNAME=postgres \
            --set env.SPRING_DATASOURCE_PASSWORD=postgres \
            --set env.SPRING_CLOUD_AWS_SQS_ENDPOINT=http://floci:4566 \
            --wait --timeout 2m

      - name: Diagnose failed deploy
        if: failure()
        run: |
          kubectl get pods -l app=api-garage -o wide
          echo "--- describe ---"
          kubectl describe pods -l app=api-garage
          echo "--- logs ---"
          kubectl logs -l app=api-garage --tail=100 --all-containers --prefix || true
          echo "--- previous logs (if crashed/restarted) ---"
          kubectl logs -l app=api-garage --tail=100 --all-containers --prefix --previous || true