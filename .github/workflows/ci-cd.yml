  build:
    runs-on: [ self-hosted, local, k8s ]
#    needs: [ owasp-report ]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Build Docker image
        run: docker build -t api-garage:${{ github.sha }} -t api-garage:latest .

      - name: Push to Local Registry
        run: |
          REGISTRY="kind-registry:5000"
          
          # 1. Builda a imagem apontando para o registro
          docker build -t $REGISTRY/api-garage:${{ github.sha }} .
          
          # 2. Empurra para o registro (o dind agora aceita HTTP nativamente para esse host)
          docker push $REGISTRY/api-garage:${{ github.sha }}

  deploy:
    runs-on: [ self-hosted, local, k8s ]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Deploy with Helm
        run: |
          helm upgrade --install api-garage helm \
            --namespace garage \
            --set image.repository=kind-registry:5000/api-garage \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 2m

      - name: Diagnose failed deploy
        if: failure()
        run: |
          kubectl -n garage get pods -l app=api-garage -o wide
          echo "--- describe ---"
          kubectl -n garage describe pods -l app=api-garage
          echo "--- logs ---"
          kubectl -n garage logs -l app=api-garage --tail=100 --all-containers --prefix || true
          echo "--- previous logs (if crashed/restarted) ---"
          kubectl -n garage logs -l app=api-garage --tail=100 --all-containers --prefix --previous || true

  stress-tests:
    needs: [ deploy ]
    runs-on: [ self-hosted, local, k8s ]
    environment: stress-testing

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Execute manual stress tests
        run: mvn clean verify -DstressTests