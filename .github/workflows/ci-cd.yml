name: CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'develop'
      - 'main'
  pull_request:
    branches:
      - 'feature/**'
      - 'develop'
      - 'main'

jobs:
  code-quality:
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Test and SonarQube analysis
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.host.url=http://sonarqube:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

  integration-tests:
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Run integration tests
        run: mvn test -DintegrationTests

  owasp-report:
    runs-on: [self-hosted, local, k8s]
    needs: [code-quality, integration-tests]

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Generate OWASP Dependency-Check report
        run: mvn -B clean verify -DskipTests -Dowasp -DdataDirectory=${{ secrets.owasp_cache_host_path }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 1

  build-and-deploy:
    needs: [owasp-report]
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Build Docker image
        run: docker build -t api-garage:${{ github.sha }} -t api-garage:latest .

      - name: Load image into cluster containerd
        run: docker save api-garage:${{ github.sha }} | ctr -a /run/containerd/containerd.sock -n k8s.io images import -

      - name: Deploy with Helm
        run: |
          helm upgrade --install api-garage helm \
            --namespace garage \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 2m

      - name: Diagnose failed deploy
        if: failure()
        run: |
          kubectl -n garage get pods -l app=api-garage -o wide
          echo "--- describe ---"
          kubectl -n garage describe pods -l app=api-garage
          echo "--- logs ---"
          kubectl -n garage logs -l app=api-garage --tail=100 --all-containers --prefix || true
          echo "--- previous logs (if crashed/restarted) ---"
          kubectl -n garage logs -l app=api-garage --tail=100 --all-containers --prefix --previous || true

  stress-tests:
    needs: [build-and-deploy]
    runs-on: [self-hosted, local, k8s]
    environment: stress-testing

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Execute manual stress tests
        run: mvn clean verify -DstressTests