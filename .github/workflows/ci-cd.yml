  build:
#    needs: [code-quality, integration-tests]
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Upload application artifact
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: application/target/*.jar
          retention-days: 1

  docker-image:
    needs: build
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: application/target

      - name: Build Docker image
        run: docker build -t api-garage:${{ github.sha }} -t api-garage:latest .

      - name: Save Docker image
        run: docker save -o api-garage-image.tar api-garage:${{ github.sha }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v5
        with:
          name: api-garage-image
          path: api-garage-image.tar
          retention-days: 1

  deploy:
    needs: docker-image
    runs-on: [self-hosted, local, k8s]

    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: api-garage-image

      - name: Load image into cluster containerd
        run: ctr -a /run/containerd/containerd.sock -n k8s.io images import api-garage-image.tar

      - name: Deploy with Helm
        run: |
          helm upgrade --install api-garage helm \
            --namespace default \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 2m

      - name: Diagnose failed deploy
        if: failure()
        run: |
          kubectl get pods -l app=api-garage -o wide
          echo "--- describe ---"
          kubectl describe pods -l app=api-garage
          echo "--- logs ---"
          kubectl logs -l app=api-garage --tail=100 --all-containers --prefix || true
          echo "--- previous logs (if crashed/restarted) ---"
          kubectl logs -l app=api-garage --tail=100 --all-containers --prefix --previous || true
